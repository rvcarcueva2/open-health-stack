services:
  db:
    # HAPI database to store resources
    # HAPI container runs an embedded H2 database inside the container’s own filesystem.
    # That’s convenient for trying things out, but the data lives and dies with the container, which is why it vanished.
    image: postgres:16
    container_name: ohs-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Named Volume
    volumes:
      - ohs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi:
    image: hapiproject/hapi:latest
    container_name: ohs-hapi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect


  openhim-mongo:
    image: mongo:4.4
    container_name: ohs-openhim-mongo
    restart: unless-stopped
    volumes:
      - ohs-openhim-mongo:/data/db

  openhim-core:
      image: jembi/openhim-core:latest
      container_name: ohs-openhim-core
      restart: unless-stopped
      depends_on:
        - openhim-mongo
      environment:
        mongo_url: mongodb://openhim-mongo/openhim
        mongo_atnaUrl: mongodb://openhim-mongo/openhim
      ports:
        - "127.0.0.1:8081:8080"   # core API (moved off 8080)
        - "127.0.0.1:5000:5000"   # HTTPS channels
        - "127.0.0.1:5001:5001"   # HTTP channels

  openhim-console:
      image: jembi/openhim-console:latest
      container_name: ohs-openhim-console
      restart: unless-stopped
      depends_on:
        - openhim-core
      ports:
        - "127.0.0.1:9000:80"
      volumes:
        - ./infra/openhim/console-default.json:/usr/share/nginx/html/config/default.json:ro


volumes:
  ohs-pgdata:
  ohs-openhim-mongo: